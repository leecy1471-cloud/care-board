<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>우리 모둠 불편함 생각도 & 발명 갤러리 | C.A.R.E. 발명교실</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- 실시간 클라우드 DB (Firebase) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #F7F9FC;
      --primary: #4F46E5;
      --accent: #FF5A79;
      --card-yellow: #FFF9C4;
      --card-pink: #FFDDE2;
      --card-blue: #E1F5FE;
      --card-green: #E8F5E9;
      --card-orange: #FFE0B2;
      --text: #1F2937;
      --shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 95px;
    }

    /* 상단 헤더 */
    header {
      background: white;
      border-bottom: 2px solid #E5E7EB;
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-care {
      background: #EEF2FF;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.8rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-pill {
      background: #F3F4F6;
      border: 1.5px solid #D1D5DB;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:active { transform: scale(0.96); }
    .btn-teacher { background: #E5E7EB; color: #374151; }
    .btn-teacher.active { background: #FEF3C7; color: #92400E; border: 1.5px solid #F59E0B; }
    .btn-present { background: #7C3AED; color: white; }

    /* 교사 전용 관리 바 */
    .teacher-bar {
      display: none;
      background: #FFFBEB;
      border-bottom: 2px dashed #FCD34D;
      padding: 10px 16px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .teacher-bar.show { display: flex; }
    .teacher-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; border-radius: 8px; }
    .btn-lock { background: #EF4444; color: white; }
    .btn-lock.locked { background: #10B981; }

    /* 활동 탭 전환 바 */
    .activity-nav {
      display: flex;
      background: white;
      border-bottom: 2px solid #E5E7EB;
      padding: 6px 14px;
      gap: 10px;
      position: sticky;
      top: 55px;
      z-index: 35;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: 900;
      font-size: 1.05rem;
      border-radius: 14px;
      border: none;
      background: #F3F4F6;
      color: #6B7280;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    /* 카테고리 필터 바 */
    .category-scroll-wrapper {
      padding: 12px 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-scroll-wrapper::-webkit-scrollbar { display: none; }
    .category-container { display: flex; gap: 8px; min-width: max-content; }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: white;
      border: 1.5px solid #E5E7EB;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #4B5563;
      cursor: pointer;
    }

    .cat-btn.active {
      background: #312E81;
      color: white;
      border-color: #312E81;
    }

    .cat-badge {
      background: rgba(0,0,0,0.08);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .cat-btn.active .cat-badge { background: rgba(255,255,255,0.3); color: white; }

    /* 메인 컨테이너 */
    main { padding: 14px 16px; max-width: 1400px; margin: 0 auto; }
    .grid-notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

    /* 포스트잇 카드 */
    .note-card {
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
      position: relative;
    }

    .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .note-tag { font-size: 0.85rem; font-weight: 800; background: rgba(255, 255, 255, 0.7); padding: 3px 8px; border-radius: 10px; }
    .note-author { font-size: 0.8rem; font-weight: 800; color: #4B5563; }
    .note-content { font-size: 1.1rem; font-weight: 800; line-height: 1.45; word-break: break-word; flex-grow: 1; margin-bottom: 12px; }
    .note-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); }

    /* 공감 버튼 */
    .btn-like {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: white;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      padding: 5px 12px;
      font-weight: 800;
      font-size: 0.85rem;
      color: #4B5563;
      cursor: pointer;
    }

    .btn-like.liked {
      background: #FFE4E6;
      color: var(--accent);
      border-color: #FECDD3;
    }

    .btn-delete {
      display: none;
      background: #FEE2E2;
      color: #DC2626;
      border: none;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }
    .teacher-active .btn-delete { display: inline-block !important; }

    .bg-yellow { background-color: var(--card-yellow); }
    .bg-pink   { background-color: var(--card-pink); }
    .bg-blue   { background-color: var(--card-blue); }
    .bg-green  { background-color: var(--card-green); }
    .bg-orange { background-color: var(--card-orange); }

    /* 활동 2: 발명 상상도 갤러리 그리드 */
    .grid-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .gallery-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 2px solid #E5E7EB;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .gallery-img-box {
      width: 100%;
      height: 200px;
      background: #F3F4F6;
      position: relative;
      overflow: hidden;
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }

    .gallery-title { font-size: 1.15rem; font-weight: 900; color: #111827; }
    .gallery-author { font-size: 0.85rem; font-weight: 800; color: #6B7280; }
    .gallery-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid #F3F4F6;
      font-size: 0.85rem;
      font-weight: 800;
    }

    /* 플로팅 버튼 */
    .floating-bar {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 35;
      pointer-events: none;
    }

    .btn-big-action {
      pointer-events: auto;
      background: var(--accent);
      color: white;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 14px 32px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(255, 90, 121, 0.4);
      border: 3px solid white;
      cursor: pointer;
    }

    /* 모달 공통 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: white;
      border-radius: 22px;
      width: 100%;
      max-width: 480px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-weight: 800; font-size: 0.95rem; margin-bottom: 6px; }
    .input-text, .textarea {
      width: 100%;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1rem;
      outline: none;
    }
    .textarea { resize: none; height: 90px; }

    /* [개선 1] 모둠 선택 버튼 스타일 확실한 강조 */
    .group-chip {
      padding: 14px 4px;
      font-size: 1.1rem;
      font-weight: 900;
      border: 2.5px solid #E5E7EB;
      background: #F9FAFB;
      border-radius: 14px;
      cursor: pointer;
      color: #374151;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .group-chip.selected {
      background: #4F46E5 !important;
      color: white !important;
      border-color: #312E81 !important;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.4) !important;
      transform: translateY(-3px) scale(1.04);
    }

    .stationery-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .item-chip {
      background: #F3F4F6;
      padding: 8px 2px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }
    .item-chip.selected { background: #EEF2FF; border: 2px solid var(--primary); color: var(--primary); }

    .image-upload-box {
      border: 2px dashed #93C5FD;
      background: #EFF6FF;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }
    .preview-box { display: none; margin-top: 10px; border-radius: 12px; overflow: hidden; max-height: 220px; }
    .preview-box img { width: 100%; height: auto; max-height: 220px; object-fit: contain; }

    .compress-spinner {
      display: none;
      margin: 10px 0;
      padding: 10px;
      background: #FEF3C7;
      color: #92400E;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      text-align: center;
    }

    /* 토스트 알림 */
    .toast-msg {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      z-index: 70;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-msg"></div>

  <!-- 교사용 관리 바 -->
  <div class="teacher-bar" id="teacherBar">
    <div style="font-weight: 800; color: #B45309;">👑 <strong>선생님 관리자 모드</strong> (삭제 버튼 노출됨)</div>
    <div class="teacher-tools">
      <button class="btn btn-sm btn-lock" id="btnToggleLock" onclick="toggleLock()">🔒 활동 마감</button>
      <button class="btn btn-sm btn-teacher" onclick="openChangePinModal()">🔑 비밀번호 변경</button>
      <button class="btn btn-sm btn-teacher" onclick="resetLocalLikes()">🔄 기기 기록 초기화</button>
      <button class="btn btn-sm btn-teacher" style="background:#EF4444; color:white;" onclick="confirmResetAll()">⚠️️ 전체 삭제</button>
      <button class="btn btn-sm btn-teacher" onclick="logoutTeacher()">나가기</button>
    </div>
  </div>

  <!-- 헤더 -->
  <header>
    <div class="header-left">
      <span class="badge-care">2학년 발명</span>
      <h1>불편함 생각도</h1>
    </div>
    <div class="header-right">
      <div class="profile-pill" onclick="openProfileModal()">
        <span id="headerProfileLabel">👤 모둠 설정</span>
      </div>
      <button class="btn btn-teacher" id="btnTeacherAuth" onclick="handleTeacherAuth()">🔒 교사</button>
    </div>
  </header>

  <!-- 활동 전환 탭 바 -->
  <div class="activity-nav">
    <button class="tab-btn active" id="tabBtn1" onclick="switchActivity('act1')">💭 활동 1: 불편함 생각도</button>
    <button class="tab-btn" id="tabBtn2" onclick="switchActivity('act2')">🎨 활동 2: 발명 상상도 갤러리</button>
  </div>

  <!-- 카테고리 필터 바 (활동 1용) -->
  <div class="category-scroll-wrapper" id="act1Filter">
    <div class="category-container" id="categoryTabs"></div>
  </div>

  <!-- 메인 영역 -->
  <main>
    <div id="act1View">
      <div class="grid-notes" id="notesGrid"></div>
    </div>

    <div id="act2View" style="display: none;">
      <div class="grid-gallery" id="galleryGrid"></div>
    </div>
  </main>

  <!-- 하단 액션 플로팅 버튼 -->
  <div class="floating-bar">
    <button class="btn-big-action" id="mainActionButton" onclick="handleMainAction()">
      ✏️ 불편한 점 적기
    </button>
  </div>

  <!-- 모달 1: 사용자 모둠/이름 설정 (선택 색상 확실하게 개선) -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content" style="text-align: center;">
      <h2 style="font-size: 1.35rem; margin-bottom: 6px;">👋 반가워요!</h2>
      <p style="color: #4B5563; font-weight: 800; margin-bottom: 16px;">내 모둠을 먼저 콕 눌러주세요</p>
      
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;">
        <button type="button" class="group-chip" onclick="selectGroupBtn(this, '1모둠')">1모둠</button>
        <button type="button" class="group-chip" onclick="selectGroupBtn(this, '2모둠')">2모둠</button>
        <button type="button" class="group-chip" onclick="selectGroupBtn(this, '3모둠')">3모둠</button>
        <button type="button" class="group-chip" onclick="selectGroupBtn(this, '4모둠')">4모둠</button>
        <button type="button" class="group-chip" onclick="selectGroupBtn(this, '5모둠')">5모둠</button>
        <button type="button" class="group-chip" onclick="selectGroupBtn(this, '6모둠')">6모둠</button>
      </div>

      <input type="text" id="inputStudentName" class="input-text" placeholder="이름 (예: 민준, 지아)" maxlength="6" style="text-align: center; margin-bottom: 14px; font-weight: 800;">
      <button class="btn btn-big-action" style="width: 100%; border-radius: 14px; font-size: 1.1rem;" onclick="saveProfile()">시작하기 ✨</button>
    </div>
  </div>

  <!-- 모달 2: 활동 1 불편함 작성 -->
  <div class="modal-overlay" id="writeModal">
    <div class="modal-content">
      <h2 style="margin-bottom: 16px;">✏️ 어떤 점이 불편했나요?</h2>
      <div class="form-group">
        <label class="form-label">1. 학용품 선택</label>
        <div class="stationery-select-grid" id="stationerySelect"></div>
      </div>
      <div class="form-group">
        <label class="form-label">2. 불편했던 점</label>
        <textarea id="inputContent" class="textarea" placeholder="예: 연필심이 툭 부러져서 자꾸 깎아야 해서 불편해요!"></textarea>
      </div>
      <button class="btn btn-big-action" style="width: 100%; border-radius: 14px; margin-top: 8px;" onclick="submitNote()">게시판에 붙이기 ✨</button>
      <button class="btn btn-teacher" style="width: 100%; margin-top: 6px; border-radius: 14px;" onclick="closeModal('writeModal')">취소</button>
    </div>
  </div>

  <!-- 모달 3: 활동 2 발명 상상도 사진 업로드 -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-content">
      <h2 style="margin-bottom: 14px;">📸 발명 상상도 올리기</h2>
      
      <div class="form-group">
        <label class="form-label">1. 종이 학습지 사진 찍기</label>
        <div class="image-upload-box" onclick="document.getElementById('cameraInput').click()">
          <div style="font-size: 2.2rem;">📷</div>
          <div style="font-weight: 800; color: #2563EB;">[여기를 눌러 사진 촬영]</div>
          <div style="font-size: 0.8rem; color: #6B7280; margin-top: 4px;">학습지가 꽉 차게 찍어주세요</div>
        </div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageOptimized(event)">
        
        <div id="compressSpinner" class="compress-spinner">
          ⏳ 사진을 가볍게 압축하고 있어요... 잠시만 기다려주세요!
        </div>

        <div class="preview-box" id="previewBox">
          <img id="previewImg" src="" alt="미리보기">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">2. 내 발명품 이름</label>
        <input type="text" id="inputDrawingTitle" class="input-text" placeholder="예: 지우개 똥 먹는 청소 연필" maxlength="25">
      </div>

      <div class="form-group">
        <label class="form-label">3. 설명 (바꾼 점)</label>
        <textarea id="inputDrawingDesc" class="textarea" placeholder="예: 지우개 뒤에 작은 롤러 청소기를 더했습니다."></textarea>
      </div>

      <button class="btn btn-big-action" id="btnUploadSubmit" style="width: 100%; border-radius: 14px;" onclick="submitDrawing()">갤러리에 올리기 🚀</button>
      <button class="btn btn-teacher" style="width: 100%; margin-top: 6px; border-radius: 14px;" onclick="closeModal('uploadModal')">취소</button>
    </div>
  </div>

  <!-- 모달 4: 작품 상세 보기 및 칭찬 댓글 (도배 방지 및 자동 닫힘 적용) -->
  <div class="modal-overlay" id="galleryDetailModal">
    <div class="modal-content" style="max-width: 550px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span id="detailAuthor" style="font-weight: 800; color: #4F46E5;">1모둠</span>
        <button class="btn btn-teacher btn-sm" onclick="closeModal('galleryDetailModal')">✕ 닫기</button>
      </div>

      <div style="border-radius: 14px; overflow: hidden; background: #F3F4F6; margin-bottom: 12px; max-height: 280px; display: flex; align-items: center; justify-content: center;">
        <img id="detailImg" src="" style="width: 100%; max-height: 280px; object-fit: contain;">
      </div>

      <h3 id="detailTitle" style="font-size: 1.25rem; font-weight: 900; margin-bottom: 6px;">작품 제목</h3>
      <p id="detailDesc" style="color: #4B5563; font-weight: 700; margin-bottom: 12px; font-size: 0.95rem;"></p>

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #E5E7EB; border-bottom: 1px solid #E5E7EB;">
        <button class="btn-like" id="btnDetailLike" onclick="toggleDrawingLike()">
          <span>❤️ 멋져요!</span>
          <span id="detailLikeCount" style="font-weight: 900;">0</span>
        </button>
        <button class="btn-delete" id="btnDetailDelete" onclick="deleteCurrentDrawing()">🗑️ 작품 삭제</button>
      </div>

      <!-- 댓글 영역 (1인 1댓글 안내) -->
      <div style="margin-top: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <h4 style="font-size: 0.95rem; font-weight: 800;">💬 친구들의 칭찬 한마디</h4>
          <span style="font-size: 0.75rem; color: #6B7280; font-weight: 700;">(작품당 1개만 쓸 수 있어요)</span>
        </div>
        
        <div style="display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px;">
          <button class="btn btn-teacher btn-sm" onclick="quickComment('아이디어가 기발해요! 💡')">💡 기발해요</button>
          <button class="btn btn-teacher btn-sm" onclick="quickComment('나도 꼭 써보고 싶어요! 😍')">😍 써보고 싶어요</button>
          <button class="btn btn-teacher btn-sm" onclick="quickComment('진짜 편리할 것 같아요! 👍')">👍 편리해요</button>
        </div>
        
        <div style="display: flex; gap: 6px; margin-top: 6px;">
          <input type="text" id="inputCommentText" class="input-text" placeholder="칭찬 한마디를 적어보세요" maxlength="40">
          <button class="btn btn-present btn-sm" id="btnSubmitComment" onclick="submitComment()">등록</button>
        </div>
        
        <div id="detailCommentList" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <!-- 모달 5: 교사 PIN 확인 -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-content" style="max-width: 320px; text-align: center;">
      <h3 style="margin-bottom: 10px;">🔒 선생님 확인</h3>
      <input type="password" id="inputPin" class="input-text" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 12px;" maxlength="8" placeholder="••••">
      <button class="btn btn-present" style="width: 100%; padding: 10px;" onclick="verifyPin()">확인</button>
    </div>
  </div>

  <!-- 모달 6: 비밀번호 변경 -->
  <div class="modal-overlay" id="changePinModal">
    <div class="modal-content" style="max-width: 340px;">
      <h3 style="margin-bottom: 12px;">🔑 비밀번호 변경</h3>
      <div class="form-group">
        <label class="form-label">현재 비밀번호</label>
        <input type="password" id="currPin" class="input-text" maxlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">새 비밀번호</label>
        <input type="password" id="newPin" class="input-text" maxlength="8">
      </div>
      <button class="btn btn-present" style="width: 100%;" onclick="saveNewPin()">변경 완료</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       [1] 전역 설정 및 Firebase 연결
       ========================================================================== */
    const STATIONERY_LIST = [
      { id: 'all', name: '전체', icon: '🌈' },
      { id: 'pencil', name: '연필', icon: '✏️' },
      { id: 'eraser', name: '지우개', icon: '🧼' },
      { id: 'scissors', name: '가위', icon: '✂️' },
      { id: 'ruler', name: '자', icon: '📏' },
      { id: 'glue', name: '풀', icon: '🧴' },
      { id: 'pencilcase', name: '필통', icon: '🧰' },
      { id: 'coloredpencil', name: '색연필', icon: '🖍️' },
      { id: 'feltpen', name: '사인펜', icon: '🖊️' }
    ];

    const firebaseConfig = {
      databaseURL: "https://care-board-452a7-default-rtdb.firebaseio.com"
    };

    let isFirebaseReady = false;
    let dbNotesRef = null;
    let dbDrawingsRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      dbNotesRef = db.ref("care_notes");
      dbDrawingsRef = db.ref("care_drawings");
      isFirebaseReady = true;
    } catch(e) {
      console.warn("로컬 모드로 작동합니다.", e);
    }

    let notes = [];
    let drawings = [];
    let currentTab = 'act1';
    let activeCategory = 'all';
    let selectedStationery = 'pencil';
    let currentUploadedImageData = '';
    let currentViewingDrawingId = null;
    let isTeacherMode = false;
    let isLocked = false;

    /* ==========================================================================
       [2] 초기화 & 프로필 체크
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      buildCategoryTabs();
      buildStationerySelectGrid();
      checkProfile();

      if (isFirebaseReady) {
        dbNotesRef.on('value', snap => {
          const val = snap.val();
          notes = val ? Object.values(val) : [];
          renderNotes();
          updateCounts();
        });
        dbDrawingsRef.on('value', snap => {
          const val = snap.val();
          drawings = val ? Object.values(val) : [];
          renderGallery();
        });
      } else {
        const localN = localStorage.getItem('care_local_notes');
        notes = localN ? JSON.parse(localN) : [];
        const localD = localStorage.getItem('care_local_drawings');
        drawings = localD ? JSON.parse(localD) : [];
        renderNotes();
        renderGallery();
        updateCounts();
      }
    });

    function checkProfile() {
      const group = localStorage.getItem('care_user_group');
      const name = localStorage.getItem('care_user_name') || '';
      if (!group) {
        document.getElementById('profileModal').classList.add('show');
      } else {
        document.getElementById('headerProfileLabel').textContent = `👤 ${group} ${name}`;
      }
    }

    /* [개선 1] 모둠 선택 시 확실한 색상 토글 */
    function selectGroupBtn(element, groupName) {
      document.querySelectorAll('.group-chip').forEach(c => c.classList.remove('selected'));
      element.classList.add('selected');
      localStorage.setItem('care_user_group', groupName);
    }

    function saveProfile() {
      const group = localStorage.getItem('care_user_group');
      if (!group) {
        alert("내 모둠 버튼을 먼저 콕 눌러주세요!");
        return;
      }
      const name = document.getElementById('inputStudentName').value.trim();
      localStorage.setItem('care_user_name', name);
      document.getElementById('headerProfileLabel').textContent = `👤 ${group} ${name}`;
      closeModal('profileModal');
      showToast(`${group} 설정 완료! 멋진 생각을 남겨보세요 ✨`);
    }

    function openProfileModal() {
      document.getElementById('profileModal').classList.add('show');
      const currentGroup = localStorage.getItem('care_user_group');
      if (currentGroup) {
        document.querySelectorAll('.group-chip').forEach(btn => {
          if (btn.textContent.trim() === currentGroup) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      }
    }

    /* ==========================================================================
       [3] 초경량 이미지 압축 엔진
       ========================================================================== */
    async function handleImageOptimized(e) {
      const file = e.target.files[0];
      if (!file) return;

      const spinner = document.getElementById('compressSpinner');
      const previewBox = document.getElementById('previewBox');
      const previewImg = document.getElementById('previewImg');
      const submitBtn = document.getElementById('btnUploadSubmit');

      spinner.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const compressedBase64 = await compressImageStream(file, 750, 0.65);
        currentUploadedImageData = compressedBase64;
        previewImg.src = compressedBase64;
        previewBox.style.display = 'block';
      } catch (err) {
        alert("사진을 불러오지 못했습니다. 다시 촬영해 주세요.");
      } finally {
        spinner.style.display = 'none';
        submitBtn.disabled = false;
        e.target.value = '';
      }
    }

    function compressImageStream(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const blobUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          URL.revokeObjectURL(blobUrl);

          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const resultBase64 = canvas.toDataURL('image/jpeg', quality);
          canvas.width = 0;
          canvas.height = 0;
          img.src = '';
          resolve(resultBase64);
        };

        img.onerror = (err) => {
          URL.revokeObjectURL(blobUrl);
          reject(err);
        };

        img.src = blobUrl;
      });
    }

    /* ==========================================================================
       [4] 활동 탭 전환 & 렌더링
       ========================================================================== */
    function switchActivity(tab) {
      currentTab = tab;
      const btn1 = document.getElementById('tabBtn1');
      const btn2 = document.getElementById('tabBtn2');
      const view1 = document.getElementById('act1View');
      const view2 = document.getElementById('act2View');
      const filter = document.getElementById('act1Filter');
      const mainBtn = document.getElementById('mainActionButton');

      if (tab === 'act1') {
        btn1.classList.add('active');
        btn2.classList.remove('active');
        view1.style.display = 'block';
        view2.style.display = 'none';
        filter.style.display = 'block';
        mainBtn.innerHTML = '✏️️ 불편한 점 적기';
      } else {
        btn2.classList.add('active');
        btn1.classList.remove('active');
        view1.style.display = 'none';
        view2.style.display = 'block';
        filter.style.display = 'none';
        mainBtn.innerHTML = '📸 내 발명 상상도 올리기';
      }
    }

    function handleMainAction() {
      if (isLocked) {
        showToast("지금은 활동이 마감되었어요!");
        return;
      }
      if (currentTab === 'act1') {
        document.getElementById('inputContent').value = '';
        document.getElementById('writeModal').classList.add('show');
      } else {
        currentUploadedImageData = '';
        document.getElementById('previewBox').style.display = 'none';
        document.getElementById('inputDrawingTitle').value = '';
        document.getElementById('inputDrawingDesc').value = '';
        document.getElementById('uploadModal').classList.add('show');
      }
    }

    /* 활동 1 포스트잇 렌더링 */
    function renderNotes() {
      const grid = document.getElementById('notesGrid');
      const filtered = activeCategory === 'all' ? notes : notes.filter(n => n.stationeryId === activeCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#9CA3AF; font-weight:800;">아직 등록된 불편함이 없어요!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(note => {
        const item = STATIONERY_LIST.find(s => s.id === note.stationeryId) || { name:'학용품', icon:'✏️' };
        const isLiked = isItemLiked('note_' + note.id);
        return `
          <div class="note-card bg-${note.color || 'yellow'}" id="card_note_${note.id}">
            <div class="note-header">
              <span class="note-tag">${item.icon} ${item.name}</span>
              <span class="note-author">${note.author || '우리반'}</span>
            </div>
            <div class="note-content">${escapeHtml(note.content)}</div>
            <div class="note-footer">
              <button class="btn-like ${isLiked ? 'liked' : ''}" onclick="toggleLikeNote('${note.id}')">
                <span>${isLiked ? '❤️ 공감 완료' : '🤍 나도 그래!'}</span>
                <span style="margin-left:4px; font-weight:900;">${note.likes || 0}</span>
              </button>
              <button class="btn-delete" onclick="deleteNote('${note.id}')">🗑️ 삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* 활동 2 갤러리 렌더링 */
    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      if (drawings.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#9CA3AF; font-weight:800;">아직 올라온 발명 상상도가 없어요!</div>`;
        return;
      }

      grid.innerHTML = drawings.map(d => {
        const commentCount = d.comments ? Object.keys(d.comments).length : 0;
        return `
          <div class="gallery-card" id="card_drawing_${d.id}" onclick="openGalleryDetail('${d.id}')">
            <div class="gallery-img-box">
              <img class="gallery-img" src="${d.imageData}" alt="${escapeHtml(d.title)}">
            </div>
            <div class="gallery-info">
              <div class="gallery-title">${escapeHtml(d.title)}</div>
              <div class="gallery-author">${escapeHtml(d.author)}</div>
              <div class="gallery-stats">
                <span style="color:#F43F5E;">❤️ ${d.likes || 0}</span>
                <span style="color:#6B7280;">💬 댓글 ${commentCount}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ==========================================================================
       [5] 공감 1인 1회 제한 로직
       ========================================================================== */
    function isItemLiked(key) {
      return localStorage.getItem('care_liked_' + key) === 'true';
    }

    function setItemLiked(key) {
      localStorage.setItem('care_liked_' + key, 'true');
    }

    function toggleLikeNote(id) {
      const key = 'note_' + id;
      if (isItemLiked(key)) {
        showToast("이미 공감(❤️)한 생각이에요! (1번만 가능해요)");
        return;
      }

      const note = notes.find(n => n.id === id);
      if (!note) return;
      note.likes = (note.likes || 0) + 1;
      setItemLiked(key);

      if (isFirebaseReady) {
        dbNotesRef.child(id).update({ likes: note.likes });
      } else {
        localStorage.setItem('care_local_notes', JSON.stringify(notes));
        renderNotes();
      }
      showToast("❤️ 공감이 전해졌어요!");
    }

    function toggleDrawingLike() {
      if (!currentViewingDrawingId) return;
      const key = 'drawing_' + currentViewingDrawingId;
      if (isItemLiked(key)) {
        showToast("이미 공감(❤️)한 작품이에요!");
        return;
      }

      const d = drawings.find(item => item.id === currentViewingDrawingId);
      if (!d) return;
      d.likes = (d.likes || 0) + 1;
      setItemLiked(key);

      if (isFirebaseReady) {
        dbDrawingsRef.child(currentViewingDrawingId).update({ likes: d.likes });
      } else {
        localStorage.setItem('care_local_drawings', JSON.stringify(drawings));
        renderGallery();
      }

      document.getElementById('detailLikeCount').textContent = d.likes;
      document.getElementById('btnDetailLike').classList.add('liked');
      showToast("❤️ 멋진 발명에 공감했어요!");
    }

    /* ==========================================================================
       [6] 데이터 등록 (포스트잇 / 사진 상상도 / 칭찬 댓글 도배방지 & 자동 닫힘)
       ========================================================================== */
    function submitNote() {
      const content = document.getElementById('inputContent').value.trim();
      if (!content) {
        alert("불편했던 점을 적어주세요!");
        return;
      }
      const group = localStorage.getItem('care_user_group') || '1모둠';
      const name = localStorage.getItem('care_user_name') || '';
      const author = name ? `${group} ${name}` : group;

      const newId = 'n_' + Date.now();
      const newNote = {
        id: newId,
        stationeryId: selectedStationery,
        content: content,
        author: author,
        color: ['yellow', 'pink', 'blue', 'green', 'orange'][Math.floor(Math.random() * 5)],
        likes: 0,
        createdAt: Date.now()
      };

      if (isFirebaseReady) {
        dbNotesRef.child(newId).set(newNote);
      } else {
        notes.unshift(newNote);
        localStorage.setItem('care_local_notes', JSON.stringify(notes));
        renderNotes();
        updateCounts();
      }

      closeModal('writeModal');
      showToast("불편한 점이 등록되었어요! ✨");
    }

    function submitDrawing() {
      const title = document.getElementById('inputDrawingTitle').value.trim();
      const desc = document.getElementById('inputDrawingDesc').value.trim();

      if (!currentUploadedImageData) {
        alert("학습지 사진을 먼저 찍어주세요!");
        return;
      }
      if (!title) {
        alert("발명품의 이름을 적어주세요!");
        return;
      }

      const group = localStorage.getItem('care_user_group') || '1모둠';
      const name = localStorage.getItem('care_user_name') || '';
      const author = name ? `${group} ${name}` : group;

      const newId = 'd_' + Date.now();
      const newDrawing = {
        id: newId,
        title: title,
        description: desc,
        author: author,
        imageData: currentUploadedImageData,
        likes: 0,
        comments: {},
        createdAt: Date.now()
      };

      if (isFirebaseReady) {
        dbDrawingsRef.child(newId).set(newDrawing);
      } else {
        drawings.unshift(newDrawing);
        localStorage.setItem('care_local_drawings', JSON.stringify(drawings));
        renderGallery();
      }

      closeModal('uploadModal');
      showToast("발명 상상도가 갤러리에 올라갔어요! 🚀");
    }

    function openGalleryDetail(id) {
      currentViewingDrawingId = id;
      const d = drawings.find(item => item.id === id);
      if (!d) return;

      document.getElementById('detailAuthor').textContent = d.author;
      document.getElementById('detailImg').src = d.imageData;
      document.getElementById('detailTitle').textContent = d.title;
      document.getElementById('detailDesc').textContent = d.description || '편리하게 바꾼 발명품입니다.';
      document.getElementById('detailLikeCount').textContent = d.likes || 0;

      const btnLike = document.getElementById('btnDetailLike');
      if (isItemLiked('drawing_' + id)) {
        btnLike.classList.add('liked');
      } else {
        btnLike.classList.remove('liked');
      }

      renderComments(d.comments);
      document.getElementById('galleryDetailModal').classList.add('show');
    }

    function renderComments(commentsObj) {
      const list = document.getElementById('detailCommentList');
      if (!commentsObj || Object.keys(commentsObj).length === 0) {
        list.innerHTML = `<div style="color:#9CA3AF; font-size:0.85rem; font-weight:700;">첫 칭찬 댓글을 남겨보세요!</div>`;
        return;
      }

      list.innerHTML = Object.values(commentsObj).map(c => `
        <div style="background:#F9FAFB; padding:7px 12px; border-radius:10px; font-size:0.85rem;">
          <strong style="color:#4B5563;">${escapeHtml(c.author)}:</strong>
          <span style="font-weight:700; color:#1F2937; margin-left:4px;">${escapeHtml(c.text)}</span>
        </div>
      `).join('');
    }

    function quickComment(text) {
      document.getElementById('inputCommentText').value = text;
      submitComment();
    }

    /* [개선 2, 3] 댓글 도배 제한 & 등록 후 자동 닫힘 피드백 */
    function submitComment() {
      const text = document.getElementById('inputCommentText').value.trim();
      if (!text || !currentViewingDrawingId) return;

      // 도배 방지: 작품당 1댓글 제한
      const commentedKey = 'care_commented_' + currentViewingDrawingId;
      if (localStorage.getItem(commentedKey) === 'true') {
        showToast("⚠️ 이 작품에는 이미 칭찬 댓글을 썼어요! (1인 1댓글)");
        return;
      }

      const btnSubmit = document.getElementById('btnSubmitComment');
      btnSubmit.disabled = true;

      const group = localStorage.getItem('care_user_group') || '1모둠';
      const name = localStorage.getItem('care_user_name') || '';
      const author = name ? `${group} ${name}` : group;

      const cId = 'c_' + Date.now();
      const newComment = { id: cId, author: author, text: text, createdAt: Date.now() };

      // 로컬에 작성 완료 기록
      localStorage.setItem(commentedKey, 'true');

      if (isFirebaseReady) {
        dbDrawingsRef.child(currentViewingDrawingId).child('comments').child(cId).set(newComment);
      } else {
        const d = drawings.find(item => item.id === currentViewingDrawingId);
        if (d) {
          if (!d.comments) d.comments = {};
          d.comments[cId] = newComment;
          localStorage.setItem('care_local_drawings', JSON.stringify(drawings));
          renderComments(d.comments);
        }
      }

      document.getElementById('inputCommentText').value = '';
      btnSubmit.disabled = false;

      // 칭찬 등록 시각 피드백 제공 후 0.9초 뒤 모달 자동 닫힘
      showToast("🎉 칭찬 댓글이 등록되었어요!");
      setTimeout(() => {
        closeModal('galleryDetailModal');
      }, 900);
    }

    /* ==========================================================================
       [7] 선생님 관리자 도구 (즉각 UI 제거 및 강력한 삭제 보장)
       ========================================================================== */
    function handleTeacherAuth() {
      if (isTeacherMode) {
        logoutTeacher();
      } else {
        document.getElementById('inputPin').value = '';
        document.getElementById('pinModal').classList.add('show');
      }
    }

    function verifyPin() {
      const input = document.getElementById('inputPin').value;
      const stored = localStorage.getItem('care_teacher_pin') || "1234";
      if (input === stored) {
        isTeacherMode = true;
        document.body.classList.add('teacher-active');
        document.getElementById('teacherBar').classList.add('show');
        document.getElementById('btnTeacherAuth').classList.add('active');
        document.getElementById('btnTeacherAuth').textContent = '🔓 교사 모드';
        closeModal('pinModal');
        renderNotes();
        showToast("선생님 관리 모드가 켜졌습니다.");
      } else {
        alert("비밀번호가 맞지 않습니다!");
      }
    }

    function logoutTeacher() {
      isTeacherMode = false;
      document.body.classList.remove('teacher-active');
      document.getElementById('teacherBar').classList.remove('show');
      document.getElementById('btnTeacherAuth').classList.remove('active');
      document.getElementById('btnTeacherAuth').textContent = '🔒 교사';
      renderNotes();
    }

    /* [개선 4] 활동 1 생각 삭제 즉각 반영 */
    function deleteNote(id) {
      if (!isTeacherMode) return;
      if (confirm("이 생각을 삭제하시겠습니까?")) {
        // 1. 화면에서 즉시 숨김
        const card = document.getElementById('card_note_' + id);
        if (card) card.remove();

        // 2. 로컬 데이터에서 즉각 제거
        notes = notes.filter(n => n.id !== id);
        localStorage.setItem('care_local_notes', JSON.stringify(notes));
        updateCounts();

        // 3. Firebase 서버 비동기 삭제
        if (isFirebaseReady) {
          dbNotesRef.child(id).remove().catch(err => {
            console.error("Firebase 삭제 실패:", err);
          });
        }
        showToast("생각이 삭제되었습니다.");
      }
    }

    /* [개선 4] 활동 2 발명 상상도 삭제 즉각 반영 */
    function deleteCurrentDrawing() {
      if (!isTeacherMode || !currentViewingDrawingId) return;
      const targetId = currentViewingDrawingId;

      if (confirm("이 발명 상상도 작품을 완전히 삭제하시겠습니까?")) {
        // 1. 모달 닫기
        closeModal('galleryDetailModal');

        // 2. 갤러리 카드 즉각 제거
        const card = document.getElementById('card_drawing_' + targetId);
        if (card) card.remove();

        // 3. 로컬 데이터 즉각 제거
        drawings = drawings.filter(d => d.id !== targetId);
        localStorage.setItem('care_local_drawings', JSON.stringify(drawings));

        // 4. Firebase 서버 비동기 삭제
        if (isFirebaseReady) {
          dbDrawingsRef.child(targetId).remove().catch(err => {
            console.error("Firebase 그림 삭제 실패:", err);
          });
        }
        showToast("작품이 삭제되었습니다.");
      }
    }

    function toggleLock() {
      isLocked = !isLocked;
      const btn = document.getElementById('btnToggleLock');
      const actionBtn = document.getElementById('mainActionButton');
      if (isLocked) {
        btn.textContent = '🔓 활동 다시 열기';
        btn.classList.add('locked');
        actionBtn.disabled = true;
        actionBtn.innerHTML = '🔒 지금은 발표 시간이에요';
      } else {
        btn.textContent = '🔒 활동 마감';
        btn.classList.remove('locked');
        actionBtn.disabled = false;
        switchActivity(currentTab);
      }
    }

    function openChangePinModal() {
      document.getElementById('currPin').value = '';
      document.getElementById('newPin').value = '';
      document.getElementById('changePinModal').classList.add('show');
    }

    function saveNewPin() {
      const curr = document.getElementById('currPin').value;
      const next = document.getElementById('newPin').value;
      const stored = localStorage.getItem('care_teacher_pin') || "1234";

      if (curr !== stored) {
        alert("현재 비밀번호가 틀렸습니다!");
        return;
      }
      if (!next || next.length < 4) {
        alert("새 비밀번호는 4자리 이상이어야 합니다.");
        return;
      }

      localStorage.setItem('care_teacher_pin', next);
      alert("비밀번호가 성공적으로 변경되었습니다!");
      closeModal('changePinModal');
    }

    function resetLocalLikes() {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('care_liked_') || key.startsWith('care_commented_')) {
          localStorage.removeItem(key);
        }
      });
      alert("이 기기의 공감 및 댓글 작성 기록이 초기화되었습니다.");
      renderNotes();
      renderGallery();
    }

    function confirmResetAll() {
      if (confirm("정말로 모든 활동 1(생각)과 활동 2(그림) 데이터를 전부 지우시겠습니까?")) {
        if (isFirebaseReady) {
          dbNotesRef.remove();
          dbDrawingsRef.remove();
        }
        notes = [];
        drawings = [];
        localStorage.removeItem('care_local_notes');
        localStorage.removeItem('care_local_drawings');
        renderNotes();
        renderGallery();
        updateCounts();
        showToast("전체 데이터가 초기화되었습니다.");
      }
    }

    /* 카테고리 보조 함수 */
    function buildCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = STATIONERY_LIST.map(cat => `
        <button class="cat-btn ${cat.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
          <span>${cat.icon} ${cat.name}</span>
          <span class="cat-badge" id="badge-${cat.id}">0</span>
        </button>
      `).join('');
    }

    function buildStationerySelectGrid() {
      const grid = document.getElementById('stationerySelect');
      const items = STATIONERY_LIST.filter(c => c.id !== 'all');
      grid.innerHTML = items.map(cat => `
        <div class="item-chip ${cat.id === selectedStationery ? 'selected' : ''}" onclick="chooseStationery('${cat.id}')">
          ${cat.icon} ${cat.name}
        </div>
      `).join('');
    }

    function chooseStationery(id) {
      selectedStationery = id;
      document.querySelectorAll('.item-chip').forEach(el => el.classList.remove('selected'));
      event.target.classList.add('selected');
    }

    function selectCategory(id) {
      activeCategory = id;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderNotes();
    }

    function updateCounts() {
      STATIONERY_LIST.forEach(cat => {
        const count = cat.id === 'all' ? notes.length : notes.filter(n => n.stationeryId === cat.id).length;
        const el = document.getElementById(`badge-${cat.id}`);
        if (el) el.textContent = count;
      });
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
